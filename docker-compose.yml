# ══════════════════════════════════════════════════════════════
# Mizan — Docker Compose for local development & testing
# ══════════════════════════════════════════════════════════════

services:
  # ── Mizan API Server ──────────────────────────────────────
  mizan-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ./benchmark_results:/app/benchmark_results
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Mizan Benchmark Runner (one-shot) ─────────────────────
  mizan-runner:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./benchmark_results:/app/benchmark_results
    working_dir: /app/src
    command: ["python", "-m", "benchmarks.runner", "--frameworks", "crewai", "langgraph"]
    profiles:
      - runner  # Only start with: docker compose --profile runner up mizan-runner

  # ── Optional: Langflow (low-code platform for testing) ────
  langflow:
    image: langflowai/langflow:latest
    ports:
      - "7860:7860"
    profiles:
      - lowcode

  # ── Optional: Flowise (low-code platform for testing) ─────
  flowise:
    image: flowiseai/flowise:latest
    ports:
      - "3000:3000"
    profiles:
      - lowcode
