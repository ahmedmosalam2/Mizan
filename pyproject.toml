[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "mizan"
version = "2.0.0"
description = "Omnichannel Ramadan Campaign Benchmark — 20 AI agentic frameworks, one real-world scenario"
requires-python = ">=3.11"

dependencies = [
    # Core runtime — always installed
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.0",          # CLI output / leaderboard tables
    "typer>=0.12",         # CLI
    "python-dotenv>=1.0",
    "openai>=1.40",        # default LLM backend
    "tiktoken>=0.7",       # token counting
    "jinja2>=3.1",         # report templates
    "aiofiles>=24.0",
    "structlog>=24.0",     # structured logging
    "tenacity>=8.3",       # retry logic in runner
]

[project.optional-dependencies]
# ── Framework extras — install only what you need ──────────────────────
crewai = [
    "crewai>=0.80.0",
    "crewai-tools>=0.14.0",
]
langgraph = [
    "langgraph>=0.2.55",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
]
autogen = [
    "pyautogen>=0.4.0",
]
agno = [
    "agno>=1.3.0",
]
llamaindex = [
    "llama-index>=0.11.0",
    "llama-index-llms-openai>=0.3.0",
]
haystack = [
    "haystack-ai>=2.5.0",
    "openai-haystack>=2.0.0",
]

# Install all 6 Phase-1 frameworks
phase1 = [
    "mizan[crewai]",
    "mizan[langgraph]",
    "mizan[autogen]",
    "mizan[agno]",
    "mizan[llamaindex]",
    "mizan[haystack]",
]

# Development
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
mizan = "mizan.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["mizan*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
