scenario_id: s11_conditional_threshold
type: human_in_the_loop
description: "10% reallocation auto-approves, 50% reallocation requires human."
task_goal: "Correctly distinguish auto-approve vs manual approval based on threshold."
agents: [AnalyticsEngine, CampaignCommander]
context:
  reallocations:
    - {id: realloc_1, from_channel: tiktok, to_channel: google_ads, amount_sar: 800, percentage: 10, should_auto_approve: true}
    - {id: realloc_2, from_channel: snapchat, to_channel: meta_ads, amount_sar: 5000, percentage: 50, should_auto_approve: false}
  approval_threshold: 0.20
  simulated_approvals: {realloc_2: {decision: approved, approver: marketing_manager}}
expected_behavior:
  realloc_1_must_auto_approve: true
  realloc_2_must_require_human: true
timeout_seconds: 90
