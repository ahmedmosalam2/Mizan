scenario_id: s10_approval_gate
type: human_in_the_loop
description: "50% budget reallocation exceeds 20% threshold, triggers mandatory approval."
task_goal: "Workflow pauses for manager approval, then applies reallocation + human feedback."
agents: [AnalyticsEngine, CampaignCommander]
context:
  current_allocation:
    meta_ads: {budget_sar: 15000, roas: 8.2}
    snapchat: {budget_sar: 10000, roas: 1.1}
    google_ads: {budget_sar: 12000, roas: 5.4}
  recommendation: {from_channel: snapchat, to_channel: meta_ads, amount_sar: 5000, percentage: 50}
  approval_rules: {threshold: 0.20, required_approvers: [marketing_manager]}
  simulated_approval: {decision: approved, approver: marketing_manager, feedback: "Also increase WhatsApp by 2000 SAR."}
expected_behavior:
  must_create_approval_gate: true
  must_pause_workflow: true
  must_resume_after_approval: true
  must_apply_human_feedback: true
timeout_seconds: 90
