scenario_id: s16_image_to_ad_copy
type: multimodal
description: "Content Architect analyses product image, generates Gulf Arabic ad copy."
task_goal: "Generate Meta carousel ad referencing visual details from image."
agents: [ContentArchitect]
context:
  task:
    product_sku: KIT-001
    product_image_url: "https://example.com/products/philips-airfryer-xxl.jpg"
    market: KSA
    format: meta_carousel
    language: ar_gulf
    requirements: ["Headline max 40 chars", "Description max 125 chars", "Must mention price 899 SAR"]
  vision_model_available: true
expected_behavior:
  must_use_vision_model: true
  must_reference_image_details: true
  must_mention_price_sar: true
timeout_seconds: 90
