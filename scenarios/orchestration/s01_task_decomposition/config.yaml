scenario_id: s01_task_decomposition
type: orchestration
description: "Commander decomposes Ramadan campaign brief into sub-tasks for 5 agents."
task_goal: "Produce campaign plan: agent assignments, channel plan with budgets, KPIs, compliance checklist."
agents: [CampaignCommander]
context:
  campaign_brief:
    campaign_name: "Ramadan Iftar Essentials 2026 - Week 1"
    company: RetailCo
    markets: [KSA, EG]
    budget:
      KSA: {amount: 50000, currency: SAR}
      EG:  {amount: 200000, currency: EGP}
    channels: [meta_ads, google_ads, snapchat, tiktok, whatsapp, sms, email]
    target_audiences:
      KSA: "Saudi females 25-40, home appliances, Riyadh/Jeddah"
      EG:  "Egyptian families, middle-class, electronics, Cairo/Alexandria"
    objectives: [Brand Awareness, Conversions, App Installs]
    start_date: "2026-02-28"
    end_date: "2026-03-30"
expected_behavior:
  min_agent_assignments: 4
  min_channels_planned: 5
  must_mention_compliance: true
timeout_seconds: 60
