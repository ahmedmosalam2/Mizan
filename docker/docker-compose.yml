version: '3.9'

services:
  # PostgreSQL - for structured data
  postgres:
    image: postgres:15-alpine
    container_name: mizan-postgres
    environment:
      POSTGRES_USER: mizan_user
      POSTGRES_PASSWORD: mizan_secure_pass_2026
      POSTGRES_DB: mizan_campaigns
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mizan_user -d mizan_campaigns"]
      interval: 10s
      timeout: 5s
      retries: 5
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mizan-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mizan.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data: